name: Godot 4.7.2 validation

on:
  push:
    branches:
      - feat/hero-world-2.5d-boss-p0
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-4-7-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Import and headless startup (Godot 4.7.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Show Godot version
        run: godot --version

      - name: Import project and parse scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -Eiq 'Parse Error|Failed to load script|SCRIPT ERROR' godot-import.log; then
            echo "Godot import reported script errors."
            exit 1
          fi

      - name: Start main project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 10 2>&1 | tee godot-runtime.log
          if grep -Eiq 'Parse Error|Failed to load script|SCRIPT ERROR|Error loading' godot-runtime.log; then
            echo "Godot runtime reported script or scene-loading errors."
            exit 1
          fi

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-logs
          path: |
            godot-import.log
            godot-runtime.log
          if-no-files-found: ignore
