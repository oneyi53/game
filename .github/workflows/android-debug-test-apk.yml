name: Android debug test APK

on:
  push:
    branches:
      - build/android-debug-apk-2026-11-05
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -o -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools/tmp"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -r "$ANDROID_HOME/cmdline-tools/tmp/cmdline-tools/"* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          test -d "$ANDROID_HOME/ndk/28.1.13356709"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"

      - name: Download Godot 4.7.2 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cd "$HOME/godot"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -o -q godot.zip
          GODOT_BIN="$(find "$HOME/godot" -maxdepth 2 -type f -name 'Godot_v4.7.2*linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          TEMPLATE_TMP="$RUNNER_TEMP/godot-export-templates"
          mkdir -p "$TEMPLATE_TMP"
          unzip -o -q templates.tpz -d "$TEMPLATE_TMP"
          ANDROID_SOURCE="$(find "$TEMPLATE_TMP" -type f -name android_source.zip -print -quit)"
          if [ -z "$ANDROID_SOURCE" ]; then
            echo "android_source.zip missing from Godot export templates" >&2
            find "$TEMPLATE_TMP" -maxdepth 4 -type f | sort | head -200 >&2
            exit 1
          fi
          cp -a "$(dirname "$ANDROID_SOURCE")/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_source.zip"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Configure Android debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.7.2.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project and export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --editor --path . --import
          "$GODOT_BIN" --headless --editor --path . --install-android-build-template
          "$GODOT_BIN" --headless --path . --verbose --export-debug "Android" build/hero-world-test.apk 2>&1 | tee android-export.log
          test -s build/hero-world-test.apk
          file build/hero-world-test.apk
          sha256sum build/hero-world-test.apk
          ls -lh build/hero-world-test.apk

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: hero-world-android-debug-test
          path: build/hero-world-test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-build-diagnostics
          path: android-export.log
          if-no-files-found: ignore
          retention-days: 7
