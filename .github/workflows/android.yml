# Hero World Android debug APK for device testing.
# This build uses the project's Godot 4.7.2 target and a temporary debug key.
# It is NOT a Play Store / production release build.
name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/android-debug-apk

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools/tmp"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -r "$ANDROID_HOME/cmdline-tools/tmp/cmdline-tools/"* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.1" \
            "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/ndk/28.1.13356709"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"

      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Verify Godot version and install matching Android export templates
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" "$RUNNER_TEMP/godot-templates"
          cd "$RUNNER_TEMP/godot-templates"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q templates.tpz -d extracted
          ANDROID_SOURCE="$(find extracted -type f -name android_source.zip -print -quit)"
          if [ -z "$ANDROID_SOURCE" ]; then
            echo "Godot 4.7.2 Android Gradle template missing from template archive." >&2
            find extracted -maxdepth 4 -type f | sort | head -200 >&2
            exit 1
          fi
          cp -a "$(dirname "$ANDROID_SOURCE")/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_source.zip"

      - name: Configure temporary Android debug signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$HOME/android-debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/android-debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/android-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project and prepare Android texture compression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("project.godot")
          s = p.read_text()
          key = "textures/vram_compression/import_etc2_astc"
          if re.search(r"(?m)^" + re.escape(key) + r"\\s*=", s):
              s = re.sub(r"(?m)^" + re.escape(key) + r"\\s*=.*$", key + "=true", s)
          elif "[rendering]" in s:
              s = s.replace("[rendering]", "[rendering]\\n" + key + "=true", 1)
          else:
              s += "\\n[rendering]\\n" + key + "=true\\n"
          p.write_text(s)
          PY
          godot --headless --editor --path . --quit

      - name: Install Gradle Android build template and export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --install-android-build-template
          godot --headless --verbose --path . --export-debug "Android" build/hero-world-debug.apk
          test -s build/hero-world-debug.apk
          ls -lh build/hero-world-debug.apk
          sha256sum build/hero-world-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: hero-world-android-debug
          path: build/hero-world-debug.apk
          if-no-files-found: error
          retention-days: 14
