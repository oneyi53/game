# Hero World Android 1.0 release build (cloud only; never run Gradle on a dev VM).
# Trigger: manual only. Godot validation runs by default; signed APK export is opt-in.
# Required repository Secrets (set in GitHub repo Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64 - base64 of the fixed release keystore (never commit the keystore itself)
#   ANDROID_KEYSTORE_PASSWORD - keystore password
#   ANDROID_KEY_ALIAS - key alias inside the keystore
#   ANDROID_KEY_PASSWORD - key password
# If any secret is missing, the job fails loudly (set -euo pipefail) and
# produces NO APK. A debug-signed build is never published as 1.0.
name: Android 1.0

on:
  push:
    branches:
      - feat/hero-world-art-integration
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build and sign a release APK (optional)'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (manual cmdline-tools; setup-android action fails looking for obsolete 'tools' package)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          # GitHub-hosted runners may predefine ANDROID_SDK_ROOT to a different SDK.
          # Keep the deprecated alias aligned with ANDROID_HOME for Gradle/AGP.
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -o -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools/tmp"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -r "$ANDROID_HOME/cmdline-tools/tmp/cmdline-tools/"* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # NOTE: do NOT run yes|sdkmanager under pipefail: when sdkmanager finishes,
          # yes gets SIGPIPE and pipefail turns that into exit 1 even on success.
          # Without pipefail the pipeline status is sdkmanager's own status, so a
          # real sdkmanager failure still fails the step (set -e), and its output
          # is kept visible instead of going to /dev/null.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          echo "Installed Android NDK and CMake:"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          ls -ld "$ANDROID_HOME/ndk/23.2.8568313" "$ANDROID_HOME/cmake/3.10.2.4988404"

      - name: Generate project icon if missing (push_files cannot carry PNG)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f icon.png ]; then
            python3 - << 'PYEOF'
          from PIL import Image, ImageDraw
          S = 512
          img = Image.new('RGBA', (S, S), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle([0, 0, S-1, S-1], radius=96, fill=(63, 174, 90, 255))
          d.ellipse([340, 48, 464, 172], fill=(255, 209, 63, 255))
          d.rectangle([232, 320, 280, 440], fill=(139, 90, 43, 255))
          d.ellipse([132, 160, 380, 380], fill=(46, 160, 67, 255))
          d.ellipse([170, 120, 342, 292], fill=(84, 200, 100, 255))
          d.ellipse([210, 170, 302, 262], fill=(120, 220, 130, 255))
          d.ellipse([120, 420, 392, 470], fill=(255, 209, 63, 255))
          img.save('icon.png')
          PYEOF
          fi
          test -s icon.png

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cd "$HOME/godot"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -o -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          # The .tpz archive may nest templates under templates/. Locate the
          # Android source template and install the full payload at Godot's version path.
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          TEMPLATE_TMP="$RUNNER_TEMP/godot-export-templates"
          mkdir -p "$TEMPLATE_TMP"
          unzip -o -q templates.tpz -d "$TEMPLATE_TMP"
          ANDROID_SOURCE="$(find "$TEMPLATE_TMP" -type f -name android_source.zip -print -quit)"
          if [ -z "$ANDROID_SOURCE" ]; then
            echo "ERROR: android_source.zip is missing from the Godot export template archive." >&2
            echo "Archive contents:" >&2
            find "$TEMPLATE_TMP" -maxdepth 4 -type f | sort | head -200 >&2
            exit 1
          fi
          SOURCE_DIR="$(dirname "$ANDROID_SOURCE")"
          cp -a "$SOURCE_DIR"/. "$TEMPLATE_DIR"/
          echo "Installed Godot Android export templates:"
          find "$TEMPLATE_DIR" -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort
          test -s "$TEMPLATE_DIR/android_source.zip"
          "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" --version

      - name: Validate Godot project (import, parse, runtime smoke test)
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --import
          "$GODOT" --headless --editor --path . --quit
          "$GODOT" --headless --path . --quit-after 3

      - name: Check release signing secrets (fail loudly if missing)
        if: ${{ inputs.build_apk }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then echo "Missing required secret: $v" >&2; exit 1; fi
          done
          echo "All release signing secrets are present."

      - name: Inject release keystore into export preset
        if: ${{ inputs.build_apk }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          test -s release.keystore
          python3 - "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" << 'PY'
          import re, sys
          pw, alias, kpw = sys.argv[1], sys.argv[2], sys.argv[3]
          p = "export_presets.cfg"
          t = open(p).read()
          t = re.sub(r'keystore/release=""', 'keystore/release="release.keystore"', t, count=1)
          t = re.sub(r'keystore/release_user=""', 'keystore/release_user="' + alias + '"', t, count=1)
          t = re.sub(r'keystore/release_password=""', 'keystore/release_password="' + pw + '"', t, count=1)
          t = re.sub(r'keystore/release_key=""', 'keystore/release_key="' + kpw + '"', t, count=1)
          open(p, "w").write(t)
          PY
          grep -c 'keystore/release="release.keystore"' export_presets.cfg

      - name: Configure Godot Android editor settings
        if: ${{ inputs.build_apk }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Configured Godot Android paths:"
          grep -E '^export/android/(java_sdk_path|android_sdk_path|debug_keystore)' "$HOME/.config/godot/editor_settings-4.tres"
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Export release APK
        if: ${{ inputs.build_apk }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          # Android export requires ETC2/ASTC texture imports. On x86_64 Linux,
          # Godot otherwise defaults to S3TC and rejects the Android preset
          # with a blank "configuration errors" message.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("project.godot")
          s = p.read_text()
          key = "textures/vram_compression/import_etc2_astc"
          if re.search(r"(?m)^" + re.escape(key) + r"\s*=", s):
              s = re.sub(r"(?m)^" + re.escape(key) + r"\s*=.*$", key + "=true", s)
          elif "[rendering]" in s:
              s = s.replace("[rendering]", "[rendering]\n" + key + "=true", 1)
          else:
              s += "\n[rendering]\n" + key + "=true\n"
          p.write_text(s)
          print("Android texture import setting:")
          for line in s.splitlines():
              if line.startswith(key + "="):
                  print(line)
                  assert line == key + "=true"
                  break
          else:
              raise SystemExit("Failed to set ETC2/ASTC texture import option")
          PY
          "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --import
          # Parse project scripts and load referenced resources before packaging.
          "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --editor --path . --quit
          # Run the main scene briefly to catch startup/runtime errors.
          "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --quit-after 3
          # Gradle mode requires the project-local android/build template, not only the global export templates.
          # Godot installs it into this checkout and then performs the release export.
          "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --verbose --install-android-build-template --export-release "Android" build/hero-world.apk

      - name: Assert APK artifact (no fake green)
        if: ${{ inputs.build_apk }}
        shell: bash
        run: |
          set -euo pipefail
          test -s build/hero-world.apk
          ls -lh build/hero-world.apk
          sha256sum build/hero-world.apk

      - name: Upload APK artifact
        if: ${{ inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: hero-world-1.0-apk
          path: build/hero-world.apk
          if-no-files-found: error
