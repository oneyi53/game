name: Godot 4.7.2 cloud validation

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "test/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-smoke:
    name: Import, parse and headless startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Verify engine version
        run: godot --version

      - name: Import project and parse scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -Eiq 'Parse Error|Failed to load script|SCRIPT ERROR|Compile Error' godot-import.log; then
            echo "Godot import reported script errors."
            exit 1
          fi

      - name: Run world coordinate regression tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_world_save_migration.gd 2>&1 | tee world-save-migration-tests.log
          if grep -Eiq 'Parse Error|Failed to load script|SCRIPT ERROR|Compile Error|Assertion failed' world-save-migration-tests.log; then
            echo "World save migration tests reported errors."
            exit 1
          fi
          grep -q "World coordinate tests: 13 passed" world-save-migration-tests.log

      - name: Run hero formation data tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_formation_manager.gd 2>&1 | tee hero-formation-tests.log
          if grep -Eiq 'Parse Error|Failed to load script|SCRIPT ERROR|Compile Error|Assertion failed' hero-formation-tests.log; then
            echo "Hero formation tests reported errors."
            exit 1
          fi
          grep -q "Hero formation tests: 13 passed" hero-formation-tests.log

      - name: Run reserve hero equipment tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_reserve_hero_equipment.gd 2>&1 | tee reserve-hero-equipment-tests.log
          if grep -Eiq 'Parse Error|Failed to load script|SCRIPT ERROR|Compile Error|Assertion failed' reserve-hero-equipment-tests.log; then
            echo "Reserve hero equipment tests reported errors."
            exit 1
          fi
          grep -q "Reserve hero equipment tests: 4 passed" reserve-hero-equipment-tests.log

      - name: Run hero power calculator tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_hero_power_calculator.gd 2>&1 | tee hero-power-tests.log
          if grep -Eiq 'Parse Error|Failed to load script|SCRIPT ERROR|Compile Error|Assertion failed' hero-power-tests.log; then
            echo "Hero power tests reported errors."
            exit 1
          fi
          grep -q "Hero power calculator tests: 3 passed" hero-power-tests.log

      - name: Run town building entrance tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_town_building_registry.gd 2>&1 | tee town-building-tests.log
          if grep -Eiq 'Parse Error|Failed to load script|SCRIPT ERROR|Compile Error|Assertion failed' town-building-tests.log; then
            echo "Town building entrance tests reported errors."
            exit 1
          fi
          grep -q "Town building entrance tests: 4 passed" town-building-tests.log

      - name: Run quest manager regression tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_quest_manager.gd 2>&1 | tee quest-manager-tests.log
          if grep -Eiq 'Parse Error|Failed to load script|SCRIPT ERROR|Compile Error|Assertion failed' quest-manager-tests.log; then
            echo "Quest manager tests reported errors."
            exit 1
          fi
          grep -q "Quest manager tests: 10 passed" quest-manager-tests.log

      - name: Run daily activity manager tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_daily_activity_manager.gd 2>&1 | tee daily-activity-tests.log
          if grep -Eiq 'Parse Error|Failed to load script|SCRIPT ERROR|Compile Error|Assertion failed' daily-activity-tests.log; then
            echo "Daily activity manager tests reported errors."
            exit 1
          fi
          grep -q "Daily activity manager tests: 14 passed" daily-activity-tests.log

      - name: Run headless project smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 15 2>&1 | tee godot-runtime.log
          if grep -Eiq 'Parse Error|Failed to load script|SCRIPT ERROR|Compile Error|Error loading' godot-runtime.log; then
            echo "Godot runtime reported script or scene-loading errors."
            exit 1
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-diagnostics
          path: |
            godot-import.log
            godot-runtime.log
            world-save-migration-tests.log
            hero-formation-tests.log
            reserve-hero-equipment-tests.log
            hero-power-tests.log
            town-building-tests.log
            quest-manager-tests.log
            daily-activity-tests.log
          if-no-files-found: ignore
