name: Inspect effect atlas
on:
  pull_request:
    paths:
      - "effect_atlas.png"
      - ".github/workflows/inspect-effect-atlas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --quiet pillow numpy scipy
      - name: Analyze atlas
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          from scipy import ndimage
          from collections import Counter
          from pathlib import Path
          import json

          p = Path("effect_atlas.png")
          im = Image.open(p)
          a = np.asarray(im.convert("RGBA"))
          h, w = a.shape[:2]
          alpha = a[:,:,3]
          visible = alpha > 8
          ys, xs = np.where(visible)
          bbox = [int(xs.min()), int(ys.min()), int(xs.max()+1), int(ys.max()+1)] if len(xs) else None
          print("=== EFFECT ATLAS REPORT ===")
          print(json.dumps({
            "file": str(p), "bytes": p.stat().st_size, "format": im.format,
            "width": w, "height": h, "mode": im.mode,
            "alpha_min": int(alpha.min()), "alpha_max": int(alpha.max()),
            "transparent_percent": round(float(np.mean(alpha == 0))*100, 2),
            "visible_percent": round(float(np.mean(visible))*100, 2),
            "visible_bbox_xyxy": bbox, "aspect_ratio": round(w/h, 4)
          }, ensure_ascii=False, indent=2))
          print("=== COMPONENTS alpha>32 (8-connected, area>=80), largest first ===")
          for threshold in (32, 128):
            labels, n = ndimage.label(alpha > threshold, structure=np.ones((3,3), dtype=np.uint8))
            objs = ndimage.find_objects(labels)
            comps=[]
            for i, sl in enumerate(objs, 1):
              if sl is None: continue
              area=int(np.count_nonzero(labels[sl] == i))
              if area < 80: continue
              y0,y1=sl[0].start,sl[0].stop
              x0,x1=sl[1].start,sl[1].stop
              comps.append((area,x0,y0,x1,y1))
            comps.sort(reverse=True)
            print(f"threshold={threshold} components={len(comps)}")
            print(json.dumps([{"area":c[0],"xyxy":list(c[1:]),"wh":[c[3]-c[1],c[4]-c[2]]} for c in comps[:80]],indent=2))
          print("=== ALPHA ROW PROFILE (64 bands, percent pixels alpha>32) ===")
          print(",".join(f"{np.mean(alpha[y*h//64:(y+1)*h//64,:]>32)*100:.1f}" for y in range(64)))
          print("=== ALPHA COLUMN PROFILE (64 bands, percent pixels alpha>32) ===")
          print(",".join(f"{np.mean(alpha[:,x*w//64:(x+1)*w//64]>32)*100:.1f}" for x in range(64)))
          PY