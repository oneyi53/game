name: Inspect effect atlas
on:
  pull_request:
    paths:
      - "effect_atlas.png"
      - ".github/workflows/inspect-effect-atlas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --quiet pillow numpy
      - name: Analyze atlas
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          from collections import Counter
          from pathlib import Path
          import json

          p = Path("effect_atlas.png")
          im = Image.open(p)
          a = np.asarray(im.convert("RGBA"))
          h, w = a.shape[:2]
          alpha = a[:,:,3]
          visible = alpha > 8
          ys, xs = np.where(visible)
          bbox = [int(xs.min()), int(ys.min()), int(xs.max()+1), int(ys.max()+1)] if len(xs) else None
          print("=== EFFECT ATLAS REPORT ===")
          print(json.dumps({
            "file": str(p), "bytes": p.stat().st_size, "format": im.format,
            "width": w, "height": h, "mode": im.mode,
            "alpha_min": int(alpha.min()), "alpha_max": int(alpha.max()),
            "transparent_percent": round(float(np.mean(alpha == 0))*100, 2),
            "visible_percent": round(float(np.mean(visible))*100, 2),
            "visible_bbox_xyxy": bbox,
            "aspect_ratio": round(w/h, 4),
            "most_common_rgba": [[list(map(int,k)),int(v)] for k,v in Counter(map(tuple,a.reshape(-1,4))).most_common(8)]
          }, ensure_ascii=False, indent=2))
          # Coarse alpha occupancy to reveal regular frame grids.
          print("=== ALPHA OCCUPANCY GRID (32 columns x 16 rows) ===")
          for gy in range(16):
            row=[]
            for gx in range(32):
              tile=visible[gy*h//16:(gy+1)*h//16, gx*w//32:(gx+1)*w//32]
              q=float(tile.mean()) if tile.size else 0
              row.append(" .:-=+*#%@"[min(9,int(q*10))])
            print("".join(row))
          # Quantized RGB color profile for visible pixels.
          rgb=a[:,:,:3][visible]
          if len(rgb):
            q=(rgb//32).astype(np.uint8)
            colors=Counter(map(tuple,q.reshape(-1,3))).most_common(16)
            print("=== DOMINANT 5-BIT RGB BINS (bin*32) ===")
            print(json.dumps([{"rgb":[int(c)*32 for c in k],"pixels":int(n)} for k,n in colors],indent=2))
          PY